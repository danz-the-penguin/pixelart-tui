[project]
name = "imagetopixelart"
version = "0.1.0"
description = "CLI tool to transform images into authentic retro pixel art for game development."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=2.0.0",
    "pillow>=10.0.0",
    "textual>=8.2.8",
]

[project.scripts]
pixelart = "pixelart.cli:main"
pixelart-tui = "pixelart.tui:run_tui"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pixelart"]
